name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Safe dependency patch update check
        run: npm outdated --long || true
      - name: Audit (report only)
        run: |
          npm audit --audit-level=moderate || echo "::warning:: audit has vulnerabilities; review before merging"
        continue-on-error: true
      - name: L1 - Content schema validation
        run: npm run test:unit
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Assert generated page count
        run: |
          page_count=$(find dist -type f -name 'index.html' | wc -l | tr -d ' ')
          project_count=$(find src/content/projects -maxdepth 1 -type f \( -name '*.md' -o -name '*.mdx' \) | wc -l | tr -d ' ')
          expected_page_count=$((2 + project_count))
          test "$page_count" -eq "$expected_page_count"
      - name: L2 - Smoke tests
        run: npm run test:smoke
      - name: L3 - Visual regression tests
        run: npm run test:visual
      - name: Verify sitemap & robots
        run: |
          ls -lh dist/sitemap-index.xml dist/sitemap-0.xml dist/robots.txt
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
